<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin sign-in | Human or Robot?</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="login">
  <form class="glass" id="f" autocomplete="on">
    <h1>Admin sign-in</h1>
    <p class="small" style="margin:0">Only authorized administrators can continue.</p>
    <label>Email<input type="email" id="email" name="email" autocomplete="username" required></label>
    <label>Password<input type="password" id="pw" name="password" autocomplete="current-password" required></label>
    <p class="err-msg" id="err" role="alert"></p>
    <button class="btn" id="go" type="submit">Sign in</button>
  </form>
</main>
<script src="/js/admin-login.js"></script>
</body>
</html>
