<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin dashboard | Human or Robot?</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="layout">
  <nav class="side" aria-label="Admin">
    <h2><span id="ico-bot" style="width:26px"></span> Admin Panel</h2>
    <a href="#stats" class="on" id="n-dash"><span class="i" data-i="grid"></span> Dashboard</a>
    <a href="#subs" id="n-subs"><span class="i" data-i="list"></span> Submissions</a>
    <button id="n-xl" type="button"><span class="i" data-i="download"></span> Export Excel</button>
    <span class="sp"></span>
    <button id="n-out" type="button"><span class="i" data-i="out"></span> Logout</button>
  </nav>
  <main class="main">
    <div class="head"><h1>Dashboard Overview</h1><button class="btn blue" id="xl" type="button">DOWNLOAD EXCEL (.XLSX)</button></div>
    <section class="stats" id="stats" aria-label="Statistics"></section>
    <section id="subs" aria-label="Submissions">
      <div class="tools">
        <label>Search by nickname<input id="q" type="search" placeholder="Search..."></label>
        <label>Identity<select id="idf"><option value="">All</option><option>Human</option><option>Robot</option></select></label>
        <label>From<input id="d1" type="date"></label>
        <label>To<input id="d2" type="date"></label>
        <label>Sort<select id="so"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Nickname A-Z</option><option value="score">Score high-low</option><option value="cat">Category</option></select></label>
      </div>
      <div class="glass tablewrap"><table>
        <thead><tr><th>ID</th><th>Nickname</th><th>Declared Identity</th><th>Verified Identity</th><th>Verification Score</th><th>Final Category</th><th>Submission Date</th><th>Photo</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody></table></div>
      <div class="pager"><span id="pinfo" class="small"></span><button class="btn ghost sm" id="prev" type="button">Previous</button><button class="btn ghost sm" id="next" type="button">Next</button></div>
    </section>
  </main>
</div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status"></div>
<script src="/js/art.js"></script>
<script src="/js/card.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
